services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - ${QDRANT_DATA_DIR:-./rag_data/qdrant_storage}:/qdrant/storage
    environment:
      - QDRANT__LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=graphrag
      - POSTGRES_USER=graphrag
      - POSTGRES_PASSWORD=graphrag_secret
    volumes:
      - rag_data_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphrag"]
      interval: 10s
      timeout: 5s
      retries: 3

  rag:
    build: .
    ports:
      - "${HTTP_PORT:-8766}:8765"
    environment:
      # Embedding: openai-compatible (bifrost)
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai-compatible}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDING_DIM=1024
      # Storage
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=postgresql://graphrag:graphrag_secret@postgres/graphrag
      - STORE_PATH=/data
      # Preload
      - PRELOAD_MODELS=${PRELOAD_MODELS:-false}
      # Chunking
      - CHUNK_SIZE=${CHUNK_SIZE:-512}
      # Reranker
      - RERANK_ENABLED=${RERANK_ENABLED:-false}
      - RERANK_PROVIDER=${RERANK_PROVIDER:-sentence_transformer}
      - RERANK_MODEL=${RERANK_MODEL}
      - RERANK_DEVICE=${RERANK_DEVICE:-cpu}
      - RERANK_TOP_K_MULTIPLIER=2
      # Query expansion
      - QUERY_EXPANSION_ENABLED=${QUERY_EXPANSION_ENABLED:-false}
      - EXPANSION_PROVIDER=${EXPANSION_PROVIDER:-ollama}
      - EXPANSION_MODEL=${EXPANSION_MODEL:-qwen3:1.8b}
      - EXPANSION_BASE_URL=${EXPANSION_BASE_URL:-http://localhost:11434}
      - EXPANSION_COUNT=3
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ${STORE_DATA_DIR:-./rag_data_clean}:/data
      - rag_data_models:/root/.cache

volumes:
  rag_data_pg:
  rag_data_models:
  rag_data_store:
