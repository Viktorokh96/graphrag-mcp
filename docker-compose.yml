services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST API — для MCP-сервера / CLI на хосте
      - "6334:6334"   # gRPC (опционально)
    volumes:
      - rag_data_qdrant:/storage
    environment:
      - QDRANT__LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=graphrag
      - POSTGRES_USER=graphrag
      - POSTGRES_PASSWORD=graphrag_secret
    volumes:
      - rag_data_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphrag"]
      interval: 10s
      timeout: 5s
      retries: 3

  rag:
    build: .
    ports:
      - "8765:8765"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=postgresql://graphrag:graphrag_secret@postgres/graphrag
      - EMBEDDING_MODEL=bge-m3
      - EMBEDDING_DEVICE=cpu
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - rag_data_models:/root/.cache

volumes:
  rag_data_qdrant:
  rag_data_pg:
  rag_data_models:
