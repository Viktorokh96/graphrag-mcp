[project]
name = "graphrag"
version = "0.2.0"
description = "Production-grade RAG MCP server with hybrid search, knowledge graph, and HTTP API"
readme = "AGENTS.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "httpx>=0.27",
    "sentence-transformers>=3.0",
    "qdrant-client>=1.10",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.0",
    "networkx>=3.0",
    "ollama>=0.4",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
# Чтение старой ChromaDB при `rag-server migrate`
migrate = ["chromadb>=0.5"]
# Postgres backend для production (DATABASE_URL=postgresql://...)
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
rag-server = "src.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # Legacy-сторы: нужны только пока идёт миграция тестов со старой архитектуры
    "chromadb>=0.5",
    "rank-bm25>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--tb=short"

[tool.ruff]
line-length = 120
